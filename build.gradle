plugins {
id 'java-library'
id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = 'com.minecraftrpgukrainy'

base {
archivesName = mod_id
}

java {
toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
version = neo_version

runs {
    client {
        client()
    }

    server {
        server()
        programArgument '--nogui'
    }
}

mods {
    "${mod_id}" {
        sourceSet sourceSets.main
    }
}

}
